name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  OktaMobile:
    url: https://github.com/okta/okta-mobile-swift
    # Pinned to the 2.x line. `from:` would also accept 3.x once published,
    # which is higher risk than usual for an authentication library
    # (token storage / endpoint semantics can change without a compile error).
    # The accompanying Package.resolved (committed, see .gitignore) locks the
    # exact resolved version for everyone on the team.
    minVersion: "2.0.0"
    maxVersion: "3.0.0"
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    dependencies:
      - package: OktaMobile
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
    postBuildScripts:
      - script: |
          bash "${SRCROOT}/Scripts/inject_okta_config.sh"
        name: Inject Okta Config
        shell: /bin/bash
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets: [AcmeBankTests, AcmeBankUITests]
      parallelizable: false
